# NLA coordinators are finite oneshot jobs with durable pending-run guards.
# Interrupting an in-flight promotion leaves Docker work running independently.
# Each scheduled invocation starts a new process using the updated libraries.
# Preserve all other needrestart defaults and automatic security updates.
$nrconf{override_rc}{qr(^nla-catalog-refresh\.service$)} = 0;
$nrconf{override_rc}{qr(^nla-market-catalog\.service$)} = 0;
