name: Bootstrap source and build verified catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/BUILD_REQUEST'

permissions:
  contents: write

concurrency:
  group: nla-catalog-bootstrap
  cancel-in-progress: false

env:
  EXPECTED_SNAPSHOT_BYTES: "360853830"
  EXPECTED_PRODUCTS: "291791"
  SOURCE_BUNDLE_SHA256: "8bd0ef386f4187f8b7c7440af1b082a8256c0be5f5172fd3aa1bea60ae4d2541"

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Verify and extract reviewed source bundle
        run: |
          test "$(find bootstrap -maxdepth 1 -type f -name 'source.tar.gz.b64.part-*' | wc -l)" -eq 5
          cat bootstrap/source.tar.gz.b64.part-* | base64 --decode > /tmp/nla-source.tar.gz
          echo "$SOURCE_BUNDLE_SHA256  /tmp/nla-source.tar.gz" | sha256sum --check --strict
          python - <<'PY2'
          import tarfile
          from pathlib import Path

          archive = Path("/tmp/nla-source.tar.gz")
          with tarfile.open(archive, "r:gz") as source:
              for member in source.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are not allowed: {member.name}")
              source.extractall(".", filter="data")
          PY2
          chmod 0755 scripts/entrypoint.sh scripts/ci_build_verified_catalog.sh

      - name: Apply security dependency baseline
        run: |
          cat > requirements.txt <<'REQ'
          fastapi==0.141.1
          starlette==1.6.0
          uvicorn[standard]==0.48.0
          httpx==0.28.1
          REQ

      - name: Install runtime, tests and dependency auditor
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip check
          pip-audit -r requirements.txt --progress-spinner=off

      - name: Require the protected Shopify Bulk URL
        env:
          SHOPIFY_BULK_URL: ${{ secrets.SHOPIFY_BULK_URL }}
        run: |
          test -n "$SHOPIFY_BULK_URL" || {
            echo '::error::Repository secret SHOPIFY_BULK_URL is missing.'
            exit 2
          }

      - name: Build, verify and smoke-test catalog runtime
        env:
          BULK_URL: ${{ secrets.SHOPIFY_BULK_URL }}
        run: bash scripts/ci_build_verified_catalog.sh

      - name: Commit reviewed source and verified runtime
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          rm -rf bootstrap .github/workflows/bootstrap-and-build.yml .github/BUILD_REQUEST
          git config user.name "nla-catalog-builder[bot]"
          git config user.email "nla-catalog-builder[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap NLA catalog gateway and verified runtime"
          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nla-catalog-bootstrap-report
          path: |
            data/catalog-manifest.json
            /tmp/snapshot.sha256
          retention-days: 14
