name: Build verified catalog artifact

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nla-catalog-build
  cancel-in-progress: false

env:
  EXPECTED_SNAPSHOT_BYTES: "360853830"
  EXPECTED_PRODUCTS: "291791"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime, tests and dependency auditor
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip check
          pip-audit -r requirements.txt --progress-spinner=off

      - name: Build, verify and smoke-test catalog runtime
        env:
          BULK_URL: ${{ secrets.SHOPIFY_BULK_URL }}
        run: bash scripts/ci_build_verified_catalog.sh

      - name: Commit verified runtime artifact
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nla-catalog-builder[bot]"
          git config user.email "nla-catalog-builder[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Runtime artifact unchanged"
          else
            git commit -m "Build verified catalog runtime artifact [skip ci]"
            auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nla-catalog-build-report
          path: |
            data/catalog-manifest.json
            /tmp/snapshot.sha256
          retention-days: 14
