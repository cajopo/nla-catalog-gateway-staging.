name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=nla_catalog_gateway --cov=scripts --cov-report=term-missing
      - run: python scripts/preflight_repo.py
      - run: python -m build

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' 'setuptools>=77' wheel pip-audit==2.10.1
      - run: python -m pip check
      - run: pip-audit --local --progress-spinner=off

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag nla-catalog-gateway:foundation .
      - name: Inspect runtime image contract
        run: |
          docker image inspect --format '{{json .Config.Cmd}}' nla-catalog-gateway:foundation |
            python -c 'import json,sys; assert json.load(sys.stdin) == ["python", "-m", "nla_catalog_gateway.runtime_bootstrap"]'
          docker image inspect --format '{{json .Config.User}}' nla-catalog-gateway:foundation |
            python -c 'import json,sys; assert json.load(sys.stdin) == "appuser"'
      - name: Verify fail-closed container commands
        run: |
          python -c 'import subprocess; p=subprocess.run(["docker", "run", "--rm", "nla-catalog-gateway:foundation"], capture_output=True, text=True); assert (p.returncode, p.stdout, p.stderr) == (1, "VALUE_FREE_RESULT: REJECTED\n", "")'
          python -c 'import subprocess; p=subprocess.run(["docker", "run", "--rm", "nla-catalog-gateway:foundation", "python", "/app/scripts/manage_staging_activation.py"], capture_output=True, text=True); assert (p.returncode, p.stdout, p.stderr) == (1, "VALUE_FREE_RESULT: REJECTED\n", "")'
      - name: Run foundation image
        run: |
          docker run --rm nla-catalog-gateway:foundation python -m nla_catalog_gateway |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p == {"readOnlyProjection": True, "service": "nla-catalog-gateway", "status": "foundation", "version": "0.0.1"}; print(json.dumps(p, sort_keys=True))'
